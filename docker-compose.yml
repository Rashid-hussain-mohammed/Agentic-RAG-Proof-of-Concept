version: '3.8'

services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount these folders so uploaded PDFs and vectors persist on your Mac
      - ./data:/app/data
      - ./vector_store:/app/vector_store
    environment:
      - MODEL_NAME=llama3
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - CHUNK_SIZE=500
      - CHUNK_OVERLAP=50
      - VECTOR_STORE_PATH=./vector_store
      # This tells the container to route Ollama requests to your Mac's localhost
      - OLLAMA_BASE_URL=http://host.docker.internal:11434ß